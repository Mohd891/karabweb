<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#06070b;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
body{position:fixed;inset:0;background:radial-gradient(circle at 50% 42%,rgba(255,255,255,.045),transparent 30%),#06070b;color:white}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
.stage{position:fixed;inset:0;display:grid;place-items:center;padding:env(safe-area-inset-top) 14px env(safe-area-inset-bottom);pointer-events:none;z-index:3}
.wrap{width:95vw;text-align:center;transform:translateY(-6vh)}
.line{display:flex;justify-content:center;gap:5px;margin:5px 0;white-space:nowrap}
.letter{display:inline-block;font-size:clamp(28px,8.1vw,72px);font-weight:900;line-height:.95;opacity:0;filter:blur(9px);transform:translate(var(--x),var(--y)) rotate(var(--r)) scale(.15);text-shadow:0 0 15px currentColor}
.small .letter{font-size:clamp(22px,6vw,50px)}
.go .letter{animation:arrive .95s cubic-bezier(.16,.88,.28,1.12) forwards,glow 1.4s ease-in-out infinite alternate;animation-delay:var(--d),calc(var(--d) + .95s)}
.namebox{margin-top:28px;opacity:0;transform:translateY(18px) scale(.95)}
.go .namebox{animation:namein .9s cubic-bezier(.2,.8,.2,1) 3.8s forwards}
.name{margin:0;font-size:clamp(46px,12vw,98px);font-weight:950;line-height:1;background:linear-gradient(90deg,#ffd18a,#ff91a5,#d6b2ff,#9ce6ff,#fff29b,#ffd18a);background-size:260% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 12px rgba(255,255,255,.2));animation:rainbow 4.5s linear infinite}

.hint{position:fixed;z-index:4;left:50%;bottom:calc(env(safe-area-inset-bottom) + 18px);transform:translateX(-50%);font-size:11px;letter-spacing:.18em;color:rgba(255,255,255,.42);opacity:0;transition:.4s;pointer-events:auto;padding:8px 12px}
.hint.show{opacity:1}
.music-toggle{position:fixed;top:calc(env(safe-area-inset-top) + 14px);right:calc(env(safe-area-inset-right) + 14px);z-index:6;border:1px solid #efdcbf55;border-radius:999px;padding:9px 13px;background:#11131bd9;color:#f5e7d0;font:12px/1.3 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;cursor:pointer;backdrop-filter:blur(8px)}
.music-toggle:focus-visible{outline:2px solid #f2cea5;outline-offset:3px}
.star{position:fixed;z-index:1;width:4px;height:4px;border-radius:50%;background:#fff;box-shadow:0 0 10px #fff;opacity:.35;animation:twinkle 2s ease-in-out infinite alternate}

.balloons{position:fixed;inset:0;overflow:hidden;pointer-events:none;z-index:5}
.balloon{position:absolute;bottom:-190px;width:42px;height:54px;border-radius:50% 50% 46% 46%;opacity:.92;animation:floatUp linear 1 forwards}
.balloon::before{content:"";position:absolute;left:50%;bottom:-8px;transform:translateX(-50%);width:10px;height:10px;background:inherit;clip-path:polygon(50% 100%,0 0,100% 0)}
.balloon::after{content:"";position:absolute;left:50%;top:52px;width:1.5px;height:90px;background:rgba(255,255,255,.45)}
.balloon span{position:absolute;inset:0;border-radius:inherit;box-shadow:inset -8px -10px 16px rgba(0,0,0,.12),inset 6px 8px 12px rgba(255,255,255,.18)}
.balloon{pointer-events:auto;cursor:pointer;touch-action:manipulation}
.pop-fragment{position:fixed;width:var(--size);height:calc(var(--size) * .72);background:var(--color);clip-path:polygon(0 0,100% 24%,73% 58%,90% 100%,12% 78%);filter:drop-shadow(0 1px 1px #0005);pointer-events:none;animation:latexSnap .58s cubic-bezier(.18,.65,.4,1) forwards}
.pop-fragment:nth-child(even){clip-path:polygon(12% 0,91% 15%,100% 78%,47% 100%,0 64%)}
.pop-string{position:fixed;width:1.5px;height:90px;background:rgba(255,255,255,.55);transform-origin:top;pointer-events:none;animation:stringDrop .68s ease-in forwards}
@keyframes latexSnap{0%{opacity:1;transform:translate(0,0) rotate(0) scale(1)}28%{opacity:1}100%{opacity:0;transform:translate(var(--dx),var(--dy)) rotate(var(--turn)) scale(.55)}}
@keyframes stringDrop{0%{opacity:.9;transform:translate(0,0) rotate(0)}100%{opacity:0;transform:translate(18px,110px) rotate(38deg)}}
@keyframes floatUp{0%{transform:translateY(0) translateX(0) rotate(0deg)}25%{transform:translateY(calc(-25vh - 70px)) translateX(var(--x1)) rotate(var(--r1))}50%{transform:translateY(calc(-50vh - 140px)) translateX(var(--x2)) rotate(var(--r2))}75%{transform:translateY(calc(-75vh - 210px)) translateX(var(--x3)) rotate(var(--r3))}100%{transform:translateY(calc(-100vh - 280px)) translateX(var(--x4)) rotate(var(--r4))}}

@keyframes arrive{0%{opacity:0;filter:blur(9px);transform:translate(var(--x),var(--y)) rotate(var(--r)) scale(.15)}72%{opacity:1;filter:blur(0);transform:translate(0,0) rotate(0) scale(1.08)}100%{opacity:1;filter:blur(0);transform:translate(0,0) rotate(0) scale(1)}}
@keyframes glow{from{text-shadow:0 0 7px currentColor}to{text-shadow:0 0 18px currentColor,0 0 30px currentColor}}
@keyframes namein{to{opacity:1;transform:translateY(0) scale(1)}}
@keyframes rainbow{to{background-position:260% 0}}
@keyframes twinkle{from{opacity:.08;transform:scale(.5)}to{opacity:.8;transform:scale(1.2)}}

/* The envelope is an optional birthday-message preview. */
.wrap{width:min(95vw,760px);transform:translateY(-1vh)}
.namebox{margin-top:24px}
.envelope-area{margin-top:18px;opacity:0;animation:envelopeIn 1s 4.8s both}
.envelope-button{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;margin:0 auto;padding:0 20px 8px;border:0;background:none;color:#f3dfc1;cursor:pointer;font:inherit;pointer-events:auto;touch-action:manipulation;transition:transform .35s ease,opacity .35s ease}
.envelope-button::after{content:"";position:absolute;inset:25% 8% 22%;background:radial-gradient(ellipse,rgba(255,164,192,.13),transparent 70%);filter:blur(18px);z-index:-1;pointer-events:none}
.envelope-art{width:216px;height:180px;object-fit:contain;filter:drop-shadow(0 10px 25px rgba(239,139,169,.13));transition:transform .45s cubic-bezier(.2,.8,.2,1);user-select:none;-webkit-user-drag:none;animation:envelopeBreathe 4.6s 6s ease-in-out infinite}
.envelope-caption{display:block;font-size:16px;line-height:1.5;color:#efdcbf;letter-spacing:0;margin-top:-10px}
.envelope-button:hover .envelope-art{transform:translateY(-6px) rotate(-2deg)}
.envelope-button:focus-visible{outline:2px solid #f2cea5;outline-offset:8px;border-radius:18px}
.envelope-button.is-opening{transform:translateY(34px) scale(.92) rotate(3deg);opacity:0;pointer-events:none}
.hint{font:inherit;font-size:12px;line-height:1.5;border:0;background:none;cursor:pointer;letter-spacing:.14em}
.letter-dialog{box-sizing:border-box;position:fixed;inset:0;margin:auto;width:min(420px,calc(100vw - 40px));height:fit-content;max-height:min(650px,calc(100dvh - 48px));padding:0;border:1px solid #e2cda8;border-radius:20px;color:#342635;background:linear-gradient(140deg,#fffdf9,#f9f1e6);overflow:auto;box-shadow:0 28px 90px #000a,0 0 80px #f4b99515;direction:rtl}
.letter-dialog::backdrop{background:rgba(4,5,9,.8);backdrop-filter:blur(9px)}
.letter-dialog[open]{animation:letterReveal .65s cubic-bezier(.18,.85,.23,1) both}
.letter-card{position:relative;padding:42px 30px 30px;text-align:center}
.letter-close{position:absolute;top:10px;left:12px;width:40px;height:40px;border:0;border-radius:50%;background:transparent;color:#887568;font:28px/1 system-ui;cursor:pointer}
.letter-close:hover{background:#dbc9ae33}
.letter-close:focus-visible{outline:2px solid #946055;outline-offset:3px}
.letter-heading{font-size:clamp(27px,7vw,35px);font-weight:650;line-height:1.55;margin:0;color:#443044}
.letter-rule{height:1px;background:linear-gradient(90deg,transparent,#d7b779,transparent);margin:24px auto;width:66%}
.letter-copy{font-size:18px;line-height:2.1;min-height:10em;margin:0;color:#715e62;white-space:pre-line;overflow-wrap:anywhere}
.letter-note{margin:18px auto 0;padding-top:14px;border-top:1px solid #d7b77966;color:#8b7378;font-size:14px;line-height:1.9;max-width:32ch}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
@keyframes envelopeIn{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
@keyframes envelopeBreathe{0%,100%{translate:0 0}50%{translate:0 -5px}}
@keyframes letterReveal{from{opacity:0;transform:translateY(60px) scale(.86) rotate(-2deg)}to{opacity:1;transform:translateY(0) scale(1) rotate(0)}}
@media(max-height:660px){.letter{font-size:clamp(24px,7vw,52px)}.small .letter{font-size:clamp(20px,5vw,42px)}.name{font-size:clamp(40px,10vw,76px)}.namebox{margin-top:18px}.envelope-area{margin-top:8px}.envelope-art{width:182px;height:150px}.letter-card{padding:40px 24px 24px}}
@media(prefers-reduced-motion:reduce){.envelope-art,.envelope-area,.go .letter,.go .namebox,.name,.star,.letter-dialog[open]{animation:none!important;opacity:1;filter:none;transform:none;translate:none}.balloons,canvas{display:none}.envelope-button,.envelope-art{transition:none!important}}

</style>

<script>
(function(){
var colors=["#ff90b7","#8ee0ff","#fff19b","#b0ff9b","#ffb287","#d5b1ff","#8ef6e8"];
function line(id,text,base){
 var e=document.getElementById(id);e.innerHTML="";
 for(var i=0;i<text.length;i++){
  var s=document.createElement("span"),a=Math.random()*Math.PI*2,dist=90+Math.random()*150;
  s.className="letter";s.textContent=text[i]==" "?"\u00a0":text[i];
  s.style.setProperty("--x",(Math.cos(a)*dist)+"px");
  s.style.setProperty("--y",(Math.sin(a)*dist)+"px");
  s.style.setProperty("--r",(-180+Math.random()*360)+"deg");
  s.style.setProperty("--d",(base+i*78)+"ms");
  s.style.color=colors[i%colors.length];e.appendChild(s);
 }
}
function build(){line("a","HAPPY",500);line("b","BIRTHDAY!",900);line("d","TO YOU",1450)}
build();
var sh=document.getElementById("stars");
for(var z=0;z<24;z++){var q=document.createElement("i");q.className="star";q.style.left=Math.random()*100+"%";q.style.top=Math.random()*100+"%";q.style.animationDelay=Math.random()*2+"s";sh.appendChild(q)}

var music=document.getElementById("bgMusic"),musicToggle=document.getElementById("musicToggle"),musicDuckTimer=0;
music.volume=.18;
function updateMusicButton(){
 var on=!music.paused;
 musicToggle.textContent=on?"♫ إيقاف الموسيقى":"♫ تشغيل الموسيقى";
 musicToggle.setAttribute("aria-pressed",String(on));
}
function startMusic(){
 music.play().then(updateMusicButton).catch(function(){updateMusicButton()});
}
musicToggle.addEventListener("click",function(e){
 e.stopPropagation();
 if(music.paused)startMusic();
 else{music.pause();updateMusicButton()}
});
document.addEventListener("pointerdown",function(e){
 if(e.target.closest("#musicToggle"))return;
 startMusic();
},{capture:true,once:true});
function duckMusic(){
 if(music.paused)return;
 music.volume=.07;
 clearTimeout(musicDuckTimer);
 musicDuckTimer=setTimeout(function(){music.volume=.18},360);
}
var balloonWrap=document.getElementById("balloons");
var popAudioCtx;
function playPop(){
 try{
  var Audio=window.AudioContext||window.webkitAudioContext;
  if(!Audio)return;
  popAudioCtx=popAudioCtx||new Audio();
  if(popAudioCtx.state==="suspended")popAudioCtx.resume();
  var duration=.075, sampleCount=Math.floor(popAudioCtx.sampleRate*duration);
  var buffer=popAudioCtx.createBuffer(1,sampleCount,popAudioCtx.sampleRate);
  var samples=buffer.getChannelData(0);
  for(var i=0;i<sampleCount;i++)samples[i]=(Math.random()*2-1)*Math.pow(1-i/sampleCount,4);
  var source=popAudioCtx.createBufferSource(),filter=popAudioCtx.createBiquadFilter(),gain=popAudioCtx.createGain();
  source.buffer=buffer;filter.type="highpass";filter.frequency.value=450;gain.gain.value=.13;
  source.connect(filter);filter.connect(gain);gain.connect(popAudioCtx.destination);
  source.start();source.stop(popAudioCtx.currentTime+duration);
 }catch(err){}
}
function showBalloonPop(rect,color){
 var cx=rect.left+rect.width/2,cy=rect.top+rect.height/2;
 for(var i=0;i<9;i++){
  var angle=2*Math.PI*i/9+(Math.random()-.5)*.3;
  var piece=document.createElement("i"),distance=32+Math.random()*46;
  piece.className="pop-fragment";
  piece.style.left=(cx+Math.cos(angle)*rect.width*.32)+"px";
  piece.style.top=(cy+Math.sin(angle)*rect.height*.32)+"px";
  piece.style.setProperty("--size",(6+Math.random()*9)+"px");
  piece.style.setProperty("--color",color);
  piece.style.setProperty("--dx",(Math.cos(angle)*distance)+"px");
  piece.style.setProperty("--dy",(Math.sin(angle)*distance+28+Math.random()*26)+"px");
  piece.style.setProperty("--turn",((-1+Math.random()*2)*220)+"deg");
  piece.style.filter="brightness("+(0.68+Math.random()*.58)+") drop-shadow(0 1px 1px #0005)";
  piece.addEventListener("animationend",function(){this.remove()},{once:true});
  balloonWrap.appendChild(piece);
 }
 var string=document.createElement("i");string.className="pop-string";
 string.style.left=cx+"px";string.style.top=(rect.bottom-3)+"px";
 string.addEventListener("animationend",function(){this.remove()},{once:true});
 balloonWrap.appendChild(string);
}
function popBalloon(e){
 var b=e.currentTarget;
 e.preventDefault();e.stopPropagation();
 if(b.dataset.popped==="1")return;
 b.dataset.popped="1";
 var rect=b.getBoundingClientRect(),color=getComputedStyle(b).backgroundColor;
 showBalloonPop(rect,color);duckMusic();playPop();
 b.style.animation="none";b.style.transition="none";
 b.style.position="fixed";b.style.left=rect.left+"px";b.style.top=rect.top+"px";
 b.style.bottom="auto";b.style.width=rect.width+"px";b.style.height=rect.height+"px";
 b.style.opacity="0";
 setTimeout(function(){b.remove()},1000);
}
function makeBalloons(){
 balloonWrap.replaceChildren();
 var bp=["#ff6fa8","#ffd166","#6dd5ff","#b6ff9d","#c7a2ff","#ff9f80","#8ef5e8"];
 var count=8;
 for(var i=0;i<count;i++){
  var bb=document.createElement("div");bb.className="balloon";
  bb.style.left=(4+Math.random()*88)+"vw";
  bb.style.bottom=(-12+Math.random()*48)+"vh";
  bb.style.width=(34+Math.random()*18)+"px";
  bb.style.height=(46+Math.random()*18)+"px";
  bb.style.background=bp[i%bp.length];
  bb.style.animationDuration=(14+Math.random()*3)+"s";
  bb.style.animationDelay=(Math.random()*.9)+"s";
  bb.style.opacity=(.72+Math.random()*.16).toFixed(2);
  bb.style.setProperty("--x1",(-24+Math.random()*48)+"px");
  bb.style.setProperty("--x2",(-34+Math.random()*68)+"px");
  bb.style.setProperty("--x3",(-28+Math.random()*56)+"px");
  bb.style.setProperty("--x4",(-38+Math.random()*76)+"px");
  bb.style.setProperty("--r1",(-5+Math.random()*10)+"deg");
  bb.style.setProperty("--r2",(-7+Math.random()*14)+"deg");
  bb.style.setProperty("--r3",(-6+Math.random()*12)+"deg");
  bb.style.setProperty("--r4",(-8+Math.random()*16)+"deg");
  bb.addEventListener("pointerdown",popBalloon);
  bb.addEventListener("click",function(e){e.preventDefault();e.stopPropagation()});
  bb.addEventListener("animationend",function(e){if(e.animationName==="floatUp")this.remove()},{once:true});
  var bi=document.createElement("span");bb.appendChild(bi);balloonWrap.appendChild(bb);
 }
}

var cv=document.getElementById("c"),ctx=cv.getContext("2d"),w=0,h=0,p=[],r=[],next=0;
function size(){var d=Math.min(devicePixelRatio||1,2);w=innerWidth;h=innerHeight;cv.width=w*d;cv.height=h*d;ctx.setTransform(d,0,0,d,0,0)}addEventListener("resize",size);size();
function col(){return colors[Math.floor(Math.random()*colors.length)]}
function rocket(t){r.push({x:w*(.14+Math.random()*.72),y:h+12,vx:(Math.random()-.5)*.5,vy:-(5.8+Math.random()*2.4),ty:h*(.12+Math.random()*.35),c:col(),tr:[]});next=t+420+Math.random()*650}
function burst(x,y,c,s){s=s||1;var n=36+Math.floor(Math.random()*24);for(var i=0;i<n;i++){var a=Math.PI*2*i/n+(Math.random()-.5)*.12,v=(.9+Math.random()*3.6)*s;p.push({x:x,y:y,px:x,py:y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,l:1,d:.009+Math.random()*.013,c:c,z:1+Math.random()*1.4})}}
function frame(t){
 ctx.globalCompositeOperation="source-over";ctx.fillStyle="rgba(6,7,11,.2)";ctx.fillRect(0,0,w,h);ctx.globalCompositeOperation="lighter";
 if(t>next)rocket(t);
 for(var i=r.length-1;i>=0;i--){var o=r[i];o.tr.push({x:o.x,y:o.y});if(o.tr.length>8)o.tr.shift();o.x+=o.vx;o.y+=o.vy;o.vy+=.02;ctx.strokeStyle=o.c;ctx.lineWidth=1.2;ctx.beginPath();var u=o.tr[0]||o;ctx.moveTo(u.x,u.y);ctx.lineTo(o.x,o.y);ctx.stroke();if(o.y<=o.ty||o.vy>=-1.1){burst(o.x,o.y,o.c,1);r.splice(i,1)}}
 for(var j=p.length-1;j>=0;j--){var x=p[j];x.px=x.x;x.py=x.y;x.x+=x.vx;x.y+=x.vy;x.vx*=.992;x.vy=x.vy*.992+.03;x.l-=x.d;if(x.l<=0){p.splice(j,1);continue}ctx.globalAlpha=x.l;ctx.strokeStyle=x.c;ctx.lineWidth=x.z;ctx.beginPath();ctx.moveTo(x.px,x.py);ctx.lineTo(x.x,x.y);ctx.stroke();ctx.globalAlpha=1}
 requestAnimationFrame(frame)
}requestAnimationFrame(frame);
var scene=document.getElementById("scene"),rep=document.getElementById("replay");
function special(){[450,900,1400,1850,2400,3000].forEach(function(t,i){setTimeout(function(){burst(w*(.16+Math.random()*.68),h*(.12+Math.random()*.36),col(),i>3?1.05:.85)},t)})}
function restart(){p=[];r=[];makeBalloons();build();scene.classList.remove("go");rep.classList.remove("show");void scene.offsetWidth;scene.classList.add("go");special();setTimeout(function(){rep.classList.add("show")},5200)}
rep.addEventListener("click",restart);addEventListener("pointerdown",function(e){if(!e.target.closest("button,dialog"))burst(e.clientX,e.clientY,col(),1.05)});
restart();
})();
</script>

<script>
(function(){
  var trigger=document.getElementById("openLetter"),modal=document.getElementById("letterModal");
  var close=document.getElementById("closeLetter"),typed=document.getElementById("typedLetter");
  var reduced=matchMedia("(prefers-reduced-motion: reduce)").matches;
  var message=Array.from(document.getElementById("letterAccessible").textContent);
  var typingTimer=0,openingTimer=0;
  function typeMessage(){
    clearTimeout(typingTimer);typed.textContent="";
    if(reduced){typed.textContent=message.join("");return;}
    var i=0;
    function tick(){
      if(!modal.open)return;
      typed.textContent+=message[i++];
      if(i<message.length)typingTimer=setTimeout(tick,message[i-1]==="\n"?140:38);
    }
    typingTimer=setTimeout(tick,440);
  }
  trigger.addEventListener("click",function(){
    if(modal.open||openingTimer)return;
    trigger.classList.add("is-opening");
    openingTimer=setTimeout(function(){
      openingTimer=0;modal.showModal();typeMessage();
    },reduced?0:300);
  });
  close.addEventListener("click",function(){modal.close();});
  modal.addEventListener("click",function(event){
    var rect=modal.getBoundingClientRect();
    if(event.target===modal&&(event.clientX<rect.left||event.clientX>rect.right||event.clientY<rect.top||event.clientY>rect.bottom))modal.close();
  });
  modal.addEventListener("close",function(){
    clearTimeout(typingTimer);trigger.classList.remove("is-opening");trigger.focus({preventScroll:true});
  });
})();
</script>

</body>
